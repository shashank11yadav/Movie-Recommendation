[project]
name = "movierec"
version = "0.1.0"
description = "Offline pipeline for a static movie recommender: MovieLens download, models, evaluation and export."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Shashank Yadav" }]
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
movierec = "movierec.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

# CPU-only torch on Linux keeps CI installs small; macOS wheels are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PTH", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "dataset: needs the MovieLens download (run `uv run movierec download` first)",
]
